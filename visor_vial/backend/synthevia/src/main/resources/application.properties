spring.application.name=synthevia

# Supabase / PostgreSQL
spring.datasource.url=jdbc:postgresql://db.lqwvnkhtcfiswmnikslr.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=GestionVial2026@
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Supabase JWT (OAuth2 Resource Server)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://lqwvnkhtcfiswmnikslr.supabase.co/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://lqwvnkhtcfiswmnikslr.supabase.co/auth/v1
