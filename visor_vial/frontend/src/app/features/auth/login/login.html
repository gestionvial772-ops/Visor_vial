<div
  class="d-flex justify-content-center align-items-center min-vh-100"
  style="background-color: #e2efea"
>
  <div
    class="card shadow-lg border-0 rounded-4 overflow-hidden"
    style="max-width: 900px; width: 100%"
  >
    <div class="row g-0">
      <div class="col-md-6 d-none d-md-block position-relative">
        <app-imagen-con-reloj></app-imagen-con-reloj>
      </div>

      <div class="col-md-6 p-5 bg-white">
        <h2 class="fw-bold mb-1" style="color: #1a3e38">SYNTHEVIA</h2>
        <p class="text-muted mb-4 small">
          ¡Bienvenido! Ingresa tus credenciales para gestionar el análisis vial.
        </p>

        <form [formGroup]="formulario" (ngSubmit)="onSubmit()">
          <app-campo-texto
            label="DNI"
            placeholder="123456789"
            icono="id-card"
            formControlName="dni"
            [mostrarError]="formulario.get('dni')!.touched && formulario.get('dni')!.invalid"
            mensajeError="El DNI es obligatorio y debe tener 8 dígitos"
          >
          </app-campo-texto>

          <app-campo-password
            label="Contraseña"
            icono="lock"
            formControlName="contrasena"
            [mostrarError]="
              formulario.get('contrasena')!.touched && formulario.get('contrasena')!.invalid
            "
            mensajeError="La contraseña es obligatoria"
          >
          </app-campo-password>

          <div class="d-flex justify-content-between align-items-center mb-4 mt-2 small">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                formControlName="recordarme"
                id="checkRecordarme"
              />
              <label class="form-check-label text-muted" for="checkRecordarme"> Recordarme </label>
            </div>
            <a href="#" class="text-decoration-none text-muted fst-italic"
              >¿Olvidaste tu contraseña?</a
            >
          </div>

          <div class="mb-4 text-center ">
            <re-captcha formControlName="captcha" class="d-flex flex-column align-items-center mt-4"></re-captcha>
            @if (formulario.get('captcha')?.touched && formulario.get('captcha')?.invalid) {
              <div class="text-danger mt-1 small">Confirma que no eres un robot.</div>
            }
          </div>

          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-4"
          >
            <span class="small fw-semibold mb-3 mb-md-0">
              ¿Nuevo usuario? <a routerLink="/auth/register" style="color: #43887b">Regístrate</a>
            </span>
            <button
              type="submit"
              class="btn text-white px-4 py-2 rounded-pill w-50 w-md-auto"
              style="background-color: #1a544a"
            >
              Iniciar sesión
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
