<div class="d-flex justify-content-center align-items-center min-vh-100 py-4" style="background-color: #E2EFEA;">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 950px; width: 100%;">
    <div class="row g-0 flex-row-reverse">
      
      <div class="col-md-5 d-none d-md-block bg-light">
        <img src="img/register.jpg" alt="Mapa Synthevia" class="img-fluid w-100 h-100" style="object-fit: cover;">
      </div>

      <div class="col-md-7 p-4 p-md-5 bg-white">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="fw-bold mb-0" style="color: #1A3E38;">SYNTHEVIA</h2>
          <span class="small fw-semibold">¿Ya tienes cuenta? <a routerLink="/auth/login" style="color: #43887B;">Inicia sesión aquí</a></span>
        </div>

        <h4 class="fw-bold text-secondary mb-4">Crea una cuenta</h4>

        <form [formGroup]="formulario" (ngSubmit)="onSubmit()">
          
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="nombres" class="form-label fw-bold small"><i class="fa-solid fa-user text-muted me-2"></i>Nombres</label>
              <input id="nombres" type="text" class="form-control rounded-pill" formControlName="nombres" placeholder="Nombres" />
            </div>
            <div class="col-md-6 mt-3 mt-md-0">
              <label for="apellidos" class="form-label fw-bold small"><i class="fa-solid fa-user text-muted me-2"></i>Apellidos</label>
              <input id="apellidos" type="text" class="form-control rounded-pill" formControlName="apellidos" placeholder="Apellidos" />
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="correoElectronico" class="form-label fw-bold small"><i class="fa-solid fa-envelope text-muted me-2"></i>Correo electrónico</label>
              <input id="correoElectronico" type="email" class="form-control rounded-pill" formControlName="correoElectronico" placeholder="example@gmail.com" />
            </div>
            <div class="col-md-6 mt-3 mt-md-0">
              <label for="dni" class="form-label fw-bold small"><i class="fa-solid fa-id-card text-muted me-2"></i>DNI</label>
              <input id="dni" type="text" class="form-control rounded-pill" formControlName="dni" maxlength="8" placeholder="12345678" />
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="contrasena" class="form-label fw-bold small"><i class="fa-solid fa-lock text-muted me-2"></i>Contraseña</label>
              <input id="contrasena" type="password" class="form-control rounded-pill" formControlName="contrasena" placeholder="********" />
            </div>
            <div class="col-md-6 mt-3 mt-md-0">
              <label for="confirmarContrasena" class="form-label fw-bold small"><i class="fa-solid fa-lock text-muted me-2"></i>Confirmar contraseña</label>
              <input id="confirmarContrasena" type="password" class="form-control rounded-pill" formControlName="confirmarContrasena" placeholder="********" />
            </div>
          </div>
          
          @if (formulario.hasError('contrasenasNoCoinciden') && formulario.get('confirmarContrasena')?.touched) {
            <div class="text-danger small mb-3">Las contraseñas no coinciden.</div>
          }

          <div class="mb-4 mt-4 d-flex justify-content-center justify-content-md-start">
             <re-captcha formControlName="captcha"></re-captcha>
          </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" formControlName="aceptaTerminos" id="checkTerminos" />
              <label class="form-check-label small text-muted" for="checkTerminos">
                Crear tu cuenta y aceptar <a href="#" style="color: #43887B;">términos y condiciones</a>
              </label>
            
          </div>

          <div class="text-center">
            <button type="submit" class="btn text-white mt-3 rounded-pill w-50 justify-content-between align-items-center" style="background-color: #1A544A;">
              Crear cuenta
            </button>
          </div>
          
        </form>
      </div>
    </div>
  </div>
</div>
