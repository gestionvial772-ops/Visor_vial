<div class="mb-3">
  @if (label) {
    <label class="form-label fw-bold">{{ label }}</label>
  }
  <div class="input-group">
    @if (icono) {
      <span class="input-group-text bg-white border-end-0">
        <i class="fa-solid fa-{{icono}} text-muted"></i>
      </span>
    }
    
    <input
      [type]="mostrarTexto ? 'text' : 'password'"
      class="form-control border-end-0"
      [class.border-start-0]="icono"
      [value]="valor"
      [disabled]="deshabilitado"
      (input)="alCambiar($any($event.target).value)"
      (blur)="alTocar()"
    />
    
    <button class="btn btn-outline-secondary bg-white " type="button" (click)="alternarVisibilidad()">
      <i class="fa-solid" [class.fa-eye]="mostrarTexto" [class.fa-eye-slash]="!mostrarTexto"></i>
    </button>
  </div>

  @if (mostrarError && mensajeError) {
    <div class="text-danger mt-1 small">{{ mensajeError }}</div>
  }
</div>
