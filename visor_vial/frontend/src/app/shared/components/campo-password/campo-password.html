<div class="campo">
  <label>{{ label }}</label>
  <div class="campo-con-icono">
    <input
      [type]="mostrarTexto ? 'text' : 'password'"
      [value]="valor"
      [disabled]="deshabilitado"
      (input)="alCambiar($any($event.target).value)"
      (blur)="alTocar()"
    />
    <button type="button" (click)="alternarVisibilidad()">
      {{ mostrarTexto ? '🙈' : '👁' }}
    </button>
  </div>
  @if (mostrarError && mensajeError) {
    <small class="error">{{ mensajeError }}</small>
  }
</div>
